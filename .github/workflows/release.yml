name: Upload Release assets and npm publish.

on:
  # dispatch from tagpr.yml workflow
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: true
        description: 'Specify release tag'

jobs:
  npm-publish-job:
    name: Upload Release assets and npm publish.
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    permissions:
      contents: write # Upload Release assets

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          scope: '@katzumi'

      - name: Install npm CLI with staged publishing support
        run: |
          npm install --global npm@latest
          node --version
          npm --version

      - name: Validate package metadata
        run: |
          node -e '
            const pkg = require("./package.json");
            if (!pkg.name) {
              console.error("package.json is missing name");
              process.exit(1);
            }
            if (!pkg.version) {
              console.error("package.json is missing version");
              process.exit(1);
            }
            console.log(`Package: ${pkg.name}`);
            console.log(`Version: ${pkg.version}`);
          '

      - name: Check tag and package version consistency
        shell: bash
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${PKG_VERSION}"
          if [ "${{ inputs.tag }}" != "${EXPECTED_TAG}" ]; then
            echo "::error::Tag input does not match package.json version"
            echo "input tag   : ${{ inputs.tag }}"
            echo "expected tag: ${EXPECTED_TAG}"
            exit 1
          fi

      - name: Get assets file name
        id: get-assets-file-name
        run: |
          assets=$(npm pack --json | jq -r '.[0].filename' | sed 's/^$//')
          echo "packFile=${assets}" >> "$GITHUB_OUTPUT"

      - name: Upload Release Asset
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: context.payload.inputs.tag
            });
            const packFile = '${{ steps.get-assets-file-name.outputs.packFile }}';
            const filePath = path.join(path.resolve(process.env.GITHUB_WORKSPACE), packFile);
            const fileContent = fs.readFileSync(filePath);
            await github.rest.repos.uploadReleaseAsset({
              url: release.data.upload_url,
              headers: {
                'content-type': 'application/octet-stream',
                'content-length': fileContent.length,
              },
              name: packFile,
              data: fileContent,
            });

      - name: Stage npm package for approval
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACK_FILE: ${{ steps.get-assets-file-name.outputs.packFile }}
        run: |
          npm stage publish "./${PACK_FILE}" \
            --access public \
            --registry=https://registry.npmjs.org/

      - name: Write approval instructions
        run: |
          {
            echo "## npm staged publishing"
            echo "The package was staged, but is not publicly available yet."
            echo "Review and approve it on npmjs.com using 2FA."
            echo "GitHub Release asset upload is complete."
          } >> "$GITHUB_STEP_SUMMARY"
