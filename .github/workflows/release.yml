name: Upload Release assets and npm publish.

on:
  # dispatch from tagpr.yml workflow
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: true
        description: 'Specify release tag'

jobs:
  npm-publish-job:
    name: Upload Release assets and npm publish.
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    permissions:
      contents: write # Upload Release assets

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          scope: '@katzumi'

      - name: Install npm CLI with staged publishing support
        run: |
          npm install --global npm@12
          node --version
          npm --version

      - name: Validate package metadata
        run: |
          node -e '
            const pkg = require("./package.json");
            if (!pkg.name) {
              console.error("package.json is missing name");
              process.exit(1);
            }
            if (!pkg.version) {
              console.error("package.json is missing version");
              process.exit(1);
            }
            console.log(`Package: ${pkg.name}`);
            console.log(`Version: ${pkg.version}`);
          '

      - name: Check tag and package version consistency
        shell: bash
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${PKG_VERSION}"
          if [ "${{ inputs.tag }}" != "${EXPECTED_TAG}" ]; then
            echo "::error::Tag input does not match package.json version"
            echo "input tag   : ${{ inputs.tag }}"
            echo "expected tag: ${EXPECTED_TAG}"
            exit 1
          fi

      - name: Get assets file name
        id: get-assets-file-name
        shell: bash
        run: |
          assets="$(npm pack --json | jq -r 'if type == "array" then .[0].filename else to_entries[0].value.filename end')"
          if [ -z "${assets}" ] || [ ! -f "${assets}" ]; then
            echo "::error::npm pack did not produce a tarball (got: '${assets}')"
            exit 1
          fi
          echo "packFile=${assets}" >> "$GITHUB_OUTPUT"
      - name: Upload Release Asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          PACK_FILE: ${{ steps.get-assets-file-name.outputs.packFile }}
        run: gh release upload "${TAG}" "${PACK_FILE}" --clobber
      - name: Stage npm package for approval
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACK_FILE: ${{ steps.get-assets-file-name.outputs.packFile }}
        run: |
          npm stage publish "./${PACK_FILE}" \
            --access public \
            --registry=https://registry.npmjs.org/

      - name: Write approval instructions
        run: |
          {
            echo "## npm staged publishing"
            echo "The package was staged, but is not publicly available yet."
            echo "Review and approve it on npmjs.com using 2FA."
            echo "GitHub Release asset upload is complete."
          } >> "$GITHUB_STEP_SUMMARY"
